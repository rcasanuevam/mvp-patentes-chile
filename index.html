<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MVP Patentes Chile v0.2</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="window.cvReady=true"></script>
<style>
body{margin:0;background:#0b0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:850px;margin:auto;padding:14px}.wrap{position:relative;border-radius:16px;overflow:hidden;background:#111}video{width:100%;display:block}#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}.status{position:absolute;top:10px;left:10px;background:#000b;padding:8px 10px;border-radius:10px;font-size:13px}.controls{display:flex;gap:8px;margin:12px 0}.controls button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:16px}.primary{background:#fff;color:#111}.secondary{background:#242932;color:#fff}.card{background:#15191f;border-radius:14px;padding:12px;margin-top:10px}.plate{font:700 22px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:#9da7b3;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #ffffff12;padding:9px 0}.ok{color:#8ce99a}.warn{color:#ffd43b}#debug{max-height:150px;overflow:auto;font-size:11px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#11151a;padding:9px;border-radius:10px;text-align:center}.stat b{display:block;font-size:20px}#work,#crop{display:none}
</style></head><body><main>
<h2>MVP Patentes — LIVE <span class="muted">v0.2</span></h2>
<div class="wrap"><video id="v" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="status" class="status">Detenido</div></div>
<div class="controls"><button id="start" class="primary">Iniciar cámara</button><button id="stop" class="secondary">Detener</button></div>
<div class="card"><b>Detección multipatente</b><div class="stats"><div class="stat"><b id="boxes">0</b><span class="muted">candidatas</span></div><div class="stat"><b id="reads">0</b><span class="muted">lecturas</span></div><div class="stat"><b id="count">0</b><span class="muted">confirmadas</span></div></div><div id="plates"></div></div>
<div class="card"><b>Diagnóstico</b><div class="muted">Busca rectángulos tipo patente en todo el campo visual. OCR sólo en candidatos. Dos lecturas compatibles para confirmar. No guarda fotos ni video.</div><div id="debug"></div></div>
<canvas id="work"></canvas><canvas id="crop"></canvas>
<script>
const v=document.querySelector('#v'),work=document.querySelector('#work'),crop=document.querySelector('#crop'),ov=document.querySelector('#overlay');
const wctx=work.getContext('2d',{willReadFrequently:true}),cctx=crop.getContext('2d',{willReadFrequently:true}),octx=ov.getContext('2d');
const statusEl=document.querySelector('#status'),platesEl=document.querySelector('#plates'),debugEl=document.querySelector('#debug');
let stream,worker,running=false,busy=false,timer,readCount=0,lastRects=[]; const votes=new Map(),confirmed=new Map();
const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
function valid(p){return /^[A-Z]{4}[0-9]{2}$/.test(p)||/^[A-Z]{2}[0-9]{4}$/.test(p)}
function substitutions(s){return s.replace(/[OQ]/g,'0').replace(/I/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8')}
function parse(text){let r=norm(text),out=[]; for(let i=0;i<=r.length-6;i++){let x=r.slice(i,i+6);if(valid(x))out.push(x);let a=x.slice(0,4)+substitutions(x.slice(4));if(valid(a))out.push(a);let b=x.slice(0,2)+substitutions(x.slice(2));if(valid(b))out.push(b)}return [...new Set(out)]}
function log(s){debugEl.innerHTML=`<div>${new Date().toLocaleTimeString()} ${s}</div>`+debugEl.innerHTML.slice(0,2600)}
function render(){platesEl.innerHTML='';[...confirmed].sort((a,b)=>b[1]-a[1]).forEach(([p,n])=>platesEl.innerHTML+=`<div class="row"><span class="plate">${p}</span><span class="ok">✓ ${n} votos</span></div>`);document.querySelector('#count').textContent=confirmed.size;document.querySelector('#reads').textContent=readCount}
function vote(p){let n=(votes.get(p)||0)+1;votes.set(p,n);if(n>=2)confirmed.set(p,n);render()}
async function initOCR(){statusEl.textContent='Cargando OCR…';worker=await Tesseract.createWorker('eng',1);await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7'});}
function detectRects(){if(!window.cvReady||typeof cv==='undefined'||!cv.Mat)return[];let src=cv.imread(work),gray=new cv.Mat(),blur=new cv.Mat(),edge=new cv.Mat(),thr=new cv.Mat(),contours=new cv.MatVector(),hier=new cv.Mat();try{cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edge,70,180);let kernel=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(9,3));cv.morphologyEx(edge,thr,cv.MORPH_CLOSE,kernel);kernel.delete();cv.findContours(thr,contours,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);let R=[];for(let i=0;i<contours.size();i++){let cnt=contours.get(i),r=cv.boundingRect(cnt);cnt.delete();let ar=r.width/r.height,area=r.width*r.height;if(ar>1.7&&ar<6.5&&r.width>55&&r.height>12&&area>900&&area<work.width*work.height*.10){R.push({...r,score:area*(1-Math.min(Math.abs(ar-3.2)/5,.7))})}}R.sort((a,b)=>b.score-a.score);return R.slice(0,6)}finally{src.delete();gray.delete();blur.delete();edge.delete();thr.delete();contours.delete();hier.delete()}}
function drawRects(rects){ov.width=v.videoWidth;ov.height=v.videoHeight;octx.clearRect(0,0,ov.width,ov.height);const sx=v.videoWidth/work.width,sy=v.videoHeight/work.height;octx.lineWidth=Math.max(3,v.videoWidth/400);octx.font=`${Math.max(22,v.videoWidth/70)}px sans-serif`;rects.forEach((r,i)=>{let x=r.x*sx,y=r.y*sy,w=r.width*sx,h=r.height*sy;octx.strokeStyle='#ffd43b';octx.strokeRect(x,y,w,h);octx.fillStyle='#ffd43b';octx.fillText('P'+(i+1),x,y-5)})}
async function scan(){if(!running||busy||!worker||v.readyState<2)return;busy=true;try{const W=v.videoWidth,H=v.videoHeight;const scale=Math.min(1,1280/W);work.width=Math.round(W*scale);work.height=Math.round(H*scale);wctx.drawImage(v,0,0,work.width,work.height);let rects=detectRects();lastRects=rects;drawRects(rects);document.querySelector('#boxes').textContent=rects.length;statusEl.textContent=`Activo · ${rects.length} candidatas`;
for(const r of rects.slice(0,4)){let padX=Math.round(r.width*.12),padY=Math.round(r.height*.45),x=Math.max(0,r.x-padX),y=Math.max(0,r.y-padY),ww=Math.min(work.width-x,r.width+2*padX),hh=Math.min(work.height-y,r.height+2*padY);crop.width=Math.max(300,ww*3);crop.height=Math.max(90,hh*3);cctx.drawImage(work,x,y,ww,hh,0,0,crop.width,crop.height);let im=cctx.getImageData(0,0,crop.width,crop.height),d=im.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];g=g>150?255:g<75?0:Math.max(0,Math.min(255,(g-105)*2+128));d[i]=d[i+1]=d[i+2]=g}cctx.putImageData(im,0,0);let {data}=await worker.recognize(crop);readCount++;let ps=parse(data.text||'');if(ps.length){log(`OCR: ${norm(data.text||'')} → ${ps.join(', ')}`);ps.forEach(vote)}render()}
}catch(e){log('error: '+e.message)}finally{busy=false}}
async function start(){if(running)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:30}},audio:false});v.srcObject=stream;await v.play();if(!worker)await initOCR();running=true;timer=setInterval(scan,900);log(`cámara ${v.videoWidth}×${v.videoHeight}; OpenCV ${window.cvReady?'OK':'cargando'}`)}catch(e){statusEl.textContent='Error de cámara';log(e.message)}}
function stop(){running=false;clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());octx.clearRect(0,0,ov.width,ov.height);statusEl.textContent='Detenido'}
document.querySelector('#start').onclick=start;document.querySelector('#stop').onclick=stop;
</script></main></body></html>
